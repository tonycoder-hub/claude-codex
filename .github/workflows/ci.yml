name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # `npm install` (not `npm ci`): the runtime SDK ships per-platform native
      # binaries as optionalDependencies, and a lockfile generated on one OS
      # omits the others, so `npm ci` fails on the Linux runner.
      - run: npm install --no-audit --no-fund
      - run: npm install --global @openai/codex@0.163.0 --no-audit --no-fund
      - run: CODEX_REAL="$(command -v codex)" npm run check:rust-protocol-fixtures
      - run: npm run check       # biome format + lint
      - run: npm run typecheck   # tsc --noEmit
      - run: npm test            # build + node --test (Node 24 has stable node:sqlite)

  # The relay/ subtree is plain .mjs with zero dependencies, so it needs no
  # install step and is not covered by `check`/`typecheck`/`test` above --
  # those are scoped to src/ and test/. Without this job it would have no CI.
  relay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:relay

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace
